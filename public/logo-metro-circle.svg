<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Crachá Circular Escuro Estilo Imagem de Referência -->
  <circle cx="256" cy="256" r="224" fill="#383b40" />

  <!-- Sombra Longa Suave -->
  <path d="M 370 162 L 468 260 L 468 390 L 370 334 Z" fill="#000000" opacity="0.16"/>

  <!-- Estrutura do Metro em Traços Brancos Finos e Precisos (stroke-width: 9.5) -->
  <g stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Indicador do Topo -->
    <rect x="222" y="98" width="68" height="24" rx="12" fill="none"/>

    <!-- Carruagem Principal -->
    <rect x="144" y="126" width="224" height="212" rx="44" fill="none"/>

    <!-- Janelas / Para-brisas com separação clara no centro -->
    <rect x="170" y="154" width="74" height="72" rx="12" fill="none"/>
    <rect x="268" y="154" width="74" height="72" rx="12" fill="none"/>

    <!-- Faróis Circulares -->
    <circle cx="188" cy="274" r="16" fill="none"/>
    <circle cx="324" cy="274" r="16" fill="none"/>

    <!-- Grelha Central: 3 traços no meio com espaçamento nítido e separado -->
    <line x1="228" y1="260" x2="284" y2="260" />
    <line x1="228" y1="274" x2="284" y2="274" />
    <line x1="228" y1="288" x2="284" y2="288" />

    <!-- Carris / Linha Férrea com espaçamento claro -->
    <!-- Base Superior da Via -->
    <line x1="174" y1="360" x2="338" y2="360" />

    <!-- Trilhos em Perspetiva Diagonal -->
    <line x1="174" y1="360" x2="132" y2="430" />
    <line x1="338" y1="360" x2="380" y2="430" />

    <!-- Travessa Intermédia Enquadrada -->
    <rect x="158" y="384" width="196" height="15" rx="5" fill="none"/>

    <!-- Travessa Inferior -->
    <line x1="140" y1="430" x2="372" y2="430" />
  </g>
</svg>
