<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 44" fill="none">
  <!-- SÍMBOLO: Metro Puro em Traço Vetorial (Sem caixinha/fundo cinzento) -->
  <g transform="translate(-11.5, -7) scale(0.115)" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Indicador do Topo -->
    <rect x="222" y="90" width="68" height="24" rx="12" fill="none"/>

    <!-- Carruagem Principal -->
    <rect x="142" y="118" width="228" height="216" rx="46" fill="none"/>

    <!-- Janelas / Para-brisas com separação central -->
    <rect x="168" y="148" width="76" height="74" rx="14" fill="none"/>
    <rect x="268" y="148" width="76" height="74" rx="14" fill="none"/>

    <!-- Faróis Circulares -->
    <circle cx="186" cy="272" r="16" fill="none"/>
    <circle cx="326" cy="272" r="16" fill="none"/>

    <!-- Grelha Frontal: 3 traços no meio com espaçamento nítido e separado -->
    <line x1="228" y1="258" x2="284" y2="258"/>
    <line x1="228" y1="272" x2="284" y2="272"/>
    <line x1="228" y1="286" x2="284" y2="286"/>

    <!-- Carris / Linha Férrea com espaçamento claro -->
    <line x1="172" y1="356" x2="340" y2="356"/>
    <line x1="172" y1="356" x2="128" y2="428"/>
    <line x1="340" y1="356" x2="384" y2="428"/>

    <!-- Travessa Intermédia Enquadrada -->
    <rect x="156" y="380" width="200" height="15" rx="5" fill="none"/>

    <!-- Travessa Inferior -->
    <line x1="138" y1="428" x2="374" y2="428"/>
  </g>

  <!-- TEXTO: NoMetro (Usa currentColor para adaptação pura em claro e escuro) -->
  <text x="42" y="28.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.9" fill="currentColor">NoMetro</text>

  <!-- CARRIS DAS 4 CORES DE LISBOA (Exatamente embaixo da palavra 'Metro', do 'M' ao 'o') -->
  <g transform="translate(72, 34)">
    <!-- Linha Azul -->
    <rect x="0" y="0" width="14.5" height="2.8" rx="1.4" fill="#0084c9"/>
    <!-- Linha Amarela -->
    <rect x="16.5" y="0" width="14.5" height="2.8" rx="1.4" fill="#ffbe00"/>
    <!-- Linha Verde -->
    <rect x="33" y="0" width="14.5" height="2.8" rx="1.4" fill="#00a650"/>
    <!-- Linha Vermelha -->
    <rect x="49.5" y="0" width="14.5" height="2.8" rx="1.4" fill="#e52329"/>
  </g>
</svg>
